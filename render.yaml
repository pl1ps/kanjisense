# Render deployment config (https://render.com).
# Render reads this on connect; you only need to set the two secret env vars
# in the dashboard (they are intentionally NOT stored in the repo).
services:
  - type: web
    name: kanjisense
    runtime: python              # app.py, requirements.txt now live at the repo root
    plan: free
    buildCommand: pip install -r requirements.txt
    # --timeout 120: dense image OCR via Gemini can take well over gunicorn's
    # 30s default, which would otherwise kill the worker mid-request.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: GOOGLE_API_KEY
        sync: false              # set in Render dashboard (kept out of the repo)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: DATABASE_URL
        sync: false              # paste your Neon Postgres connection string here
      - key: PYTHON_VERSION
        value: "3.12"
